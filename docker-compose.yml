services:
  db:
    image: postgres:15.15-alpine3.22
    container_name: nestjs_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sakila
    ports:
      - "5432:5432"
    volumes:
      # Mapeo de scripts a la carpeta de inicialización
      - ./sql_scripts:/docker-entrypoint-initdb.d
